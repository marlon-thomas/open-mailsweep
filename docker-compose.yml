services:
  sweeper:
    build:
      context: .
    env_file: .env
    volumes:
      - ./secrets:/app/secrets
      - ./data:/app/data
      - ./policy.yaml:/app/policy.yaml:ro
    ports:
      # OAuth callback (8765) is mapped only during the one-time
      # `docker compose run -p 127.0.0.1:8765:8765 sweeper auth` invocation,
      # never permanently, so it cannot collide with other local services.
      - "127.0.0.1:${UI_PORT:-8787}:${UI_PORT:-8787}"
    command: ["serve"]
    restart: unless-stopped
