[project]
name = "open-mailsweep"
version = "1.0.0"
description = "Open-source mail sweeper for Gmail and Yahoo: fast local personalised classification, learned rules, queues, and a human-in-the-loop web UI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "google-api-python-client>=2.149.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "pydantic>=2.9.2",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.5.0",
  "typer>=0.12.5",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]

[project.scripts]
openmailsweep = "openmailsweep.cli:app"
open-mailsweep = "openmailsweep.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
openmailsweep = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
